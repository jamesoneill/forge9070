[package]
name = "nextora-engine"
default-run = "nextora"
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
description = "Nextora native Rust CPU and Vulkan inference engine"
license = "MIT"
publish = false

[features]
experimental-prism = []
prism-vulkan = ["experimental-prism"]

[dependencies]
sha2 = "0.10"
anyhow = "1"
ash = "0.38"
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
minijinja = { version = "3.1", features = ["json", "serde", "fuel", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }
httparse = "1"
rayon = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[[bin]]
name = "nextora"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
