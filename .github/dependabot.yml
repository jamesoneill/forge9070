version: 2
updates:
  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    # Version updates remain reviewable PRs; there is deliberately no
    # auto-merge workflow and no dependency update may bypass main's rules.
    groups:
      rust-patch-updates:
        update-types: [patch]
