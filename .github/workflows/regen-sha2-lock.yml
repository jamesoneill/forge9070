name: Temporary sha2 lockfile regeneration

on:
  pull_request:
    paths:
      - .github/workflows/regen-sha2-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock:
    if: github.head_ref == 'dependabot/cargo/sha2-0.11.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin project Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Resolve without running model code
        shell: bash
        run: |
          cargo update -p sha2 --precise 0.11.1
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          printf 'NEXTORA_SHA2_LOCK_BEGIN\n'
          base64 -w0 Cargo.lock
          printf '\nNEXTORA_SHA2_LOCK_END\n'
