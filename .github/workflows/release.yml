name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching Cargo.toml (for example v0.9.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  FORGE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify owner merge and successful main CI
    if: >-
      github.repository == 'jamesoneill/forge9070' &&
      github.actor == 'jamesoneill' &&
      github.triggering_actor == 'jamesoneill' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - name: Check out the trusted gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the owner's merged PR and passing main CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify-release.py --tag "$FORGE_TAG"

  build:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: forge-engine
            rustflags: '-C target-cpu=x86-64'
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: forge-engine.exe
            rustflags: '-C target-cpu=x86-64 -C target-feature=+crt-static'
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify tag and install the pinned Rust toolchain
        env:
          FORGE_TARGET: ${{ matrix.target }}
        run: |
          python -c 'import importlib.util, os; s=importlib.util.spec_from_file_location("release", ".github/scripts/package-release.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.validate_tag(os.environ["FORGE_TAG"]))'
          FORGE_TOOLCHAIN="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$FORGE_TOOLCHAIN" --profile minimal --target "$FORGE_TARGET"
      - name: Test and build the native engine
        env:
          FORGE_TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked -p forge-engine --lib --bins --target "$FORGE_TARGET"
          cargo build --release --locked -p forge-engine --target "$FORGE_TARGET"
      - name: Exercise the exact executable being packaged
        env:
          FORGE_BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: |
          python scripts/validate-forge-engine.py --binary "$FORGE_BINARY" --output artifacts/release-cli.json
          python scripts/validate-native-api.py --binary "$FORGE_BINARY" --output artifacts/release-api.json
          python scripts/validate-native-ui.py --binary "$FORGE_BINARY" --output artifacts/release-ui.json
      - name: Package binary, usage guide, licenses and checksums
        env:
          FORGE_TARGET: ${{ matrix.target }}
          FORGE_BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: python .github/scripts/package-release.py --tag "$FORGE_TAG" --target "$FORGE_TARGET" --binary "$FORGE_BINARY" --output dist
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-${{ matrix.target }}
          path: artifacts/release-*.json
          if-no-files-found: ignore
          retention-days: 14

  draft:
    name: Create verified draft release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download both platform candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-x86_64-*
          path: dist
          merge-multiple: true
      - name: Verify archives and prepare notes
        run: python .github/scripts/prepare-release.py --tag "$FORGE_TAG" --directory dist
      - name: Create or refresh a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$FORGE_TAG" --json isDraft > release-state.json 2> release-query-error.txt; then
            python -c 'import json, sys; sys.exit(0 if json.load(open("release-state.json")).get("isDraft") is True else "Refusing to change a published release")'
            gh release edit "$FORGE_TAG" --draft --title "Forge9070 $FORGE_TAG" --notes-file dist/RELEASE-NOTES.md
          else
            # gh release create fails safely if the query error was something
            # other than a missing release. --verify-tag never creates a tag.
            gh release create "$FORGE_TAG" --verify-tag --draft --title "Forge9070 $FORGE_TAG" --notes-file dist/RELEASE-NOTES.md
          fi
          gh release upload "$FORGE_TAG" dist/*.zip dist/*.tar.gz dist/*.build.json dist/*.sha256 dist/SHA256SUMS --clobber
          printf '%s\n' 'Draft release prepared. Only the repository owner should review and publish it.' >> "$GITHUB_STEP_SUMMARY"
