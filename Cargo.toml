[package]
name = "forge9070"
version = "0.9.1"
edition = "2024"
rust-version = "1.100"
description = "ForgeAI backwards-compatible command alias for the single native Rust engine"
license = "MIT"
publish = false

[workspace]
members = [".", "crates/forge-engine"]
default-members = ["crates/forge-engine"]
resolver = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
forge-engine = { path = "crates/forge-engine" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 2
